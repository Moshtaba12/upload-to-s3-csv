name: upload-to-s3

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy to'
        required: true
        type: choice
        options:
          - DEV
          - STAGING
          - PROD

        
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

permissions:
  contents: read

jobs:
  prepare-data:
    name: Prepare data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: csv-files
          path: ./Data

  release-data:
    name: Release data
    runs-on: ubuntu-latest
    needs: prepare-data
  
    steps:
      - name: Download artifact
        uses: actions/upload-artifact@v7

      - name: Test artifact download 
        run: ls -R
      


    